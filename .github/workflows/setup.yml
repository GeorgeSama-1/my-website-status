# Based on Upptime v1.46.4; locally reviewed workflows.
# See docs/monitor-maintenance.md before regenerating templates.

name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: write

jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@fefca90fa2ccfc66ca39a11f40dcc90236da05ac # v1.46.4
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
      - name: Update summary in README
        uses: upptime/uptime-monitor@fefca90fa2ccfc66ca39a11f40dcc90236da05ac # v1.46.4
        with:
          command: "readme"
        env:
          GH_PAT: ${{ github.token }}
      - name: Generate graphs
        id: dispatch_graphs
        uses: benc-uk/workflow-dispatch@v1
        continue-on-error: true
        with:
          workflow: Graphs CI
          token: ${{ github.token }}
      - name: Setup Node.js for direct graph generation
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Generate graphs directly if dispatch fails
        if: steps.dispatch_graphs.outcome == 'failure'
        uses: upptime/uptime-monitor@fefca90fa2ccfc66ca39a11f40dcc90236da05ac # v1.46.4
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ github.token }}
