# Based on Upptime v1.46.4; locally reviewed workflows.
# See docs/monitor-maintenance.md before regenerating templates.

name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  repository_dispatch:
    types: [response_time]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@fefca90fa2ccfc66ca39a11f40dcc90236da05ac # v1.46.4
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{}'
