# Workflow changes are reviewed maintenance, separate from uptime monitoring.
name: Update Template CI
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.repository }}-${{ github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Update reviewed Upptime templates
    runs-on: ubuntu-latest
    env:
      TEMPLATE_TOKEN: ${{ secrets.UPPTIME_TEMPLATE_TOKEN }}
    steps:
      - name: Explain optional workflow credential
        if: env.TEMPLATE_TOKEN == ''
        run: echo "::notice::Template update skipped. Routine monitoring uses GITHUB_TOKEN. To update workflow files, configure a dedicated UPPTIME_TEMPLATE_TOKEN with Contents and Workflows write permissions, then rerun manually."
      - name: Checkout
        if: env.TEMPLATE_TOKEN != ''
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          token: ${{ env.TEMPLATE_TOKEN }}
      - name: Update template
        if: env.TEMPLATE_TOKEN != ''
        uses: upptime/uptime-monitor@fefca90fa2ccfc66ca39a11f40dcc90236da05ac # v1.46.4
        with:
          command: update-template
        env:
          GH_PAT: ${{ env.TEMPLATE_TOKEN }}
